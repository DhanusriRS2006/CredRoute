<!-- templates/upload.html -->
<!DOCTYPE html>
<html>
<head><title>Transfer Credit Evaluation — Upload</title></head>
<body style="font-family: sans-serif; max-width: 600px; margin: 40px auto;">
  <h2>Upload Transcript</h2>
  <form action="/evaluations/run" method="post" enctype="multipart/form-data">
    <label>Transcript (PDF, JPG, or PNG):</label><br>
    <input type="file" name="transcript" accept=".pdf,.jpg,.jpeg,.png" required><br><br>
    <button type="submit">Upload & Evaluate</button>
    <label>Percentage in qualifying exam:</label>
    <input type="number" step="0.01" name="percentage" required><br>
    <label>Prior branch:</label>
    <input type="text" name="prior_branch" required><br>
    <label>Institution recognition:</label>
    <input type="text" name="institution_recognition" value="AICTE" required><br>
</form>
</body>
</html>
